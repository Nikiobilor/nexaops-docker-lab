# =============================================================================
# NexaOps Hello World Workflow
# Purpose: understand GitHub Actions syntax before building the real pipeline
# =============================================================================

name: Hello NexaOps

# Trigger: run on every push to any branch
on:
  push:
    branches: ["**"]

jobs:

  greet:
    name: Greet the team
    runs-on: ubuntu-22.04

    steps:
      # Step 1: checkout the repo code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: run a shell command
      - name: Print greeting
        run: |
          echo "Hello from NexaOps CI pipeline!"
          echo "Triggered by: ${{ github.actor }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"

      # Step 3: show the repo structure
      - name: Show repo contents
        run: |
          echo "Repository contents:"
          ls -la
          echo ""
          echo "Dashboard contents:"
          ls -la dashboard/

      # Step 4: show runner environment
      - name: Show runner info
        run: |
          echo "OS: $(uname -a)"
          echo "Python: $(python3 --version)"
          echo "Docker: $(docker --version)"
          echo "Available memory:"
          free -h
