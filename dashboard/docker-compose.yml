# =============================================================================
# NexaOps Dashboard — Docker Compose Stack
# Services: dashboard (Flask), redis (cache), postgres (database)
# =============================================================================

version: "3.9"

services:

  # ── Dashboard ──────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    image: nexaops-dashboard:1.0.0
    container_name: nexaops-dashboard
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nexaops
      DB_USER: nexaops
      DB_PASSWORD: ${DB_PASSWORD:-nexaops}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_VERSION: "1.0.0"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - nexaops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexaops-redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - nexaops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: nexaops-postgres
    environment:
      POSTGRES_DB: nexaops
      POSTGRES_USER: nexaops
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexaops}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nexaops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexaops -d nexaops"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    name: nexaops-postgres-data
  redis-data:
    name: nexaops-redis-data

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  nexaops-network:
    name: nexaops-network
    driver: bridge
