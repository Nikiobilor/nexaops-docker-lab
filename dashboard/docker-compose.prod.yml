# Production overrides — used with:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: "3.9"

services:
  dashboard:
    environment:
      ENVIRONMENT: production
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    restart: always

  postgres:
    restart: always
